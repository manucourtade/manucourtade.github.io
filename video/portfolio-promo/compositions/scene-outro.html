    // This scene timeline is independently seekable by HyperFrames.
    const sceneRoot = document.querySelector('[data-composition-id="scene-outro"]');
    const timeline = gsap.timeline({ paused: true });
    const revealItems = sceneRoot.querySelectorAll(".outro-kicker, .outro-title, .outro-email, .outro-links, .scene-tag, .outro-note");
    timeline.fromTo(sceneRoot, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06 }, 0);
    timeline.fromTo(revealItems, { autoAlpha: 0, y: 34 }, {
      autoAlpha: 1, y: 0, duration: 0.72, stagger: 0.09, ease: 'power3.out'
    }, 0.18);
    timeline.to(sceneRoot, { autoAlpha: 0, duration: 0.48, ease: 'power2.in' }, 5.42);
    timeline.set({}, {}, 5.90);
    window.__timelines = window.__timelines || {};
    window.__timelines['scene-outro'] = timeline;
  </script>

  </style>
